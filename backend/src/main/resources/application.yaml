spring:
  application:
    name: it-service-desk
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
  datasource:
    url: ${ITSD_DB_URL:jdbc:postgresql://127.0.0.1:5433/it_service_desk}
    username: ${ITSD_DB_USER:itsd}
    password: ${ITSD_DB_PASSWORD:itsd_local}
    hikari:
      connection-timeout: 2000
      initialization-fail-timeout: -1

server:
  address: 127.0.0.1
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        name: ITSDSESSION
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      group:
        database:
          include: db
