name: it-service-desk
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: it_service_desk
      POSTGRES_USER: itsd
      POSTGRES_PASSWORD: itsd_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "itsd", "-d", "it_service_desk"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
